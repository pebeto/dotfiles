# Workstation-specific sway bits. Included by ~/.config/sway/config
# via the ~/.config/sway-host.conf symlink.

# Bar background (used inside the shared bar { ... } block)
set $bar_bg #000000

# Matched by make/model/serial rather than connector: the DP connector renumbers
# across ports and reboots, which silently drops the mode line.
output "Samsung Electric Company Odyssey G70D H1AK500000" position 0 0 mode 3840x2160@144Hz adaptive_sync on

# This panel runs unscaled, so the shared font sizes are set here rather than in
# sway/config, which every host reads.
font pango:JuliaMono Regular 15
seat * xcursor_theme Adwaita 36

# Width of the clock popup's frame, used by the cal-popup rule to shift it flush with
# the right edge: 52 columns at JuliaMono 16.5 is 676 px, plus the 3 px border twice.
set $cal_popup_w 682

# Night-light plus a per-display gamma trim. The Samsung reads brighter than the
# ICC-corrected image Windows produces, so pull it down on the Sway side and
# leave the shared monitor OSD (and the T470) untouched. Tuned by eye:
# -b is brightness (day:night, kept equal), -g is gamma (<1 darker).
exec gammastep -l $geoloc -b 0.90:0.90
