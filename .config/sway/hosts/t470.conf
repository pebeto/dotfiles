# T470-specific sway bits. Included by ~/.config/sway/config via the
# ~/.config/sway-host.conf symlink.

# The internal panel is 1920x1080 unscaled, so it keeps the original size rather than the
# workstation's 4K one. No xcursor_theme here: the default is fine at this size.
font pango:JuliaMono Regular 10

# swayfx effects (see the shared config): the corner radius matches the bar's
# panels at this font size, and one blur pass fewer spares the Intel GPU.
set $radius 7
set $blur_passes 2

# Notification handler for kernel/EC-driven hardware keys (wifi, bluetooth,
# fnlock). Userspace actions are in the shared config.
set $indicators ~/.config/sway/indicators.sh

# Night-light (location-based day/night color temperature). No brightness trim
# here; the internal panel looks fine as-is.
exec gammastep -l $geoloc

### Touchpad configuration
input "2:7:SynPS/2_Synaptics_TouchPad" {
    dwt enabled
    tap enabled
    natural_scroll enabled
    middle_emulation enabled
}

### Window overview (woverview): three fingers up opens it, and again closes it
bindgesture swipe:3:up exec ~/.local/bin/woverview

# Pressing it again while the overview is open closes it.
bindsym Mod1+space exec ~/.local/bin/woverview

### TrackPoint configuration
input "2:10:TPPS/2_IBM_TrackPoint" {
    pointer_accel -0.5
    dwt enabled
}

### Hardware key bindings (ACPI handles the state change; script notifies)
bindsym XF86WLAN      exec $indicators wifi
bindsym XF86Bluetooth exec $indicators bluetooth

# Super + F10 opens the bar's Bluetooth panel. Fires only when F10 emits the
# F10 keysym (FnLock making F-keys primary); in media mode the key emits
# XF86Bluetooth and this binding won't match. (Plain XF86Bluetooth without
# $mod stays the radio on/off notifier above.)
bindsym $mod+F10 exec qs ipc call panel toggle bluetooth

# FnLock state notifier. Fn+Esc toggles FnLock at the EC level and
# Wayland doesn't see the keypress, so this is a manual on-demand
# readout of the current state from sysfs.
bindsym $mod+Shift+f exec $indicators fnlock
