# Qwen3.6-27B (apache-2.0) served by vLLM: reasoning, tools, images.
#
# Schema (see run.sh): `image:` is the Docker image, `env-NAME:` becomes -e NAME=val, and
# every other `key: value` becomes a `vllm serve --key value` flag.

image: vllm/vllm-openai:v0.26.0      # pin a stable release, not nightly

# unsloth's build is compressed-tensors W4A4 and runs on the native CUTLASS FP4 kernels.
# NVIDIA's ModelOpt build falls back to Marlin: half the cold-prefill speed here, and where
# the EngineDeadError crashes cluster on Blackwell (vLLM #49926). Format is auto-detected.
model: unsloth/Qwen3.6-27B-NVFP4
served-model-name: qwen3.6-27b
host: 0.0.0.0
port: 8000

# Weights take 21.34 GiB, leaving 4.31 GiB of KV for 130,108 tokens. fp8 KV is what buys a
# window this size, at the cost of an uncalibrated q_scale warning each boot. vLLM prints
# the real ceiling and refuses to boot above it, so trust the log over any estimate.
kv-cache-dtype: fp8
max-model-len: 122880

# Images yes, video no: one video item reserves a six-figure token budget and several GiB
# this card does not have. The image count is per conversation rather than per message, and
# overrunning it 400s every later request instead of degrading. vLLM caps it at
# max-model-len over 16384 tokens per image, so 122880 allows 7.
limit-mm-per-prompt: '{"image": 7, "video": 0}'

# Host RAM for processed images, multiplied by (api_server_count + data_parallel_size), so
# the 4 GiB default can claim 8 GiB of the box's ~30 GB.
mm-processor-cache-gb: 1

# 0.90 leaves ~3 GB for the sway compositor on this single-GPU box.
gpu-memory-utilization: 0.90
max-num-seqs: 4
enable-chunked-prefill: true
enable-prefix-caching: true

# qwen3_xml is the parser vLLM's NVFP4 recipe uses; the card's qwen3_coder targets the
# unquantized path. Sampling is per-request, so it lives in the client.
reasoning-parser: qwen3
enable-auto-tool-choice: true
tool-call-parser: qwen3_xml

# No speculative decoding: the MTP layer ships here and vLLM supports qwen3_5_mtp, but
# #35800 (open) has it corrupting tool calls and crashing on NVFP4 Qwen3.5 on Blackwell.
