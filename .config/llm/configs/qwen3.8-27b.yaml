# Qwen3.8-27B (apache-2.0) served by vLLM: reasoning, tools, images.
#
# Schema (see run.sh): `image:` is the Docker image, `env-NAME:` becomes -e NAME=val, and
# every other `key: value` becomes a `vllm serve --key value` flag.

image: vllm/vllm-openai:v0.30.0      # pin a stable release, not nightly

# unsloth's build is compressed-tensors W4A4 and runs on the native CUTLASS FP4 kernels.
# NVIDIA-style ModelOpt builds fall back to Marlin: half the cold-prefill speed here, and
# where the EngineDeadError crashes cluster on Blackwell (vLLM #49926). The format is
# auto-detected, so there is no `quantization:` key.
#
# Architecture is unchanged from Qwen3.6 (Qwen3_5ForConditionalGeneration, model_type
# qwen3_5, 64 layers, same vision config), so this vLLM release serves it as-is.
model: unsloth/Qwen3.8-27B-NVFP4
served-model-name: qwen3.8-27b
host: 0.0.0.0
port: 8000

# KV is pinned, not sized from gpu-memory-utilization: vLLM measures device-wide free VRAM
# while it starts, so desktop allocations during those two minutes come out of the pool and
# boots fail at random. 3.6 GiB holds 84,365 tokens every time. Four 4096px images at once
# peak vLLM at 29.3 GiB, 0.75 GiB over the 0.91 budget; the unpinned pool did the same.
# fp8 KV is what buys a window this size, at the cost of an uncalibrated q_scale warning.
kv-cache-dtype: fp8
max-model-len: 81920
kv-cache-memory-bytes: 3865470566   # 3.6 GiB

# Multi-token prediction, using the MTP layer already in this checkpoint, so there is no
# draft model to download. `mtp` resolves to the Qwen3_5MTP architecture and shares the
# target's embedding and lm_head. Against ~66 tok/s without it, decode runs 1.5x on prose and
# 1.7-2.3x on code, reasoning and tool calls; acceptance follows the same order, 37% on prose
# up to 95% on tool calls. k=3 beat k=2, and k=4 did not fit the KV pool when tried. Add
# `--per-request-spec-decode-metrics summary` to read acceptance per request.
speculative-config: '{"method":"mtp","num_speculative_tokens":3}'

# Left to itself 0.30.0 picks FLASHINFER, which needs about 0.6 GiB more than TRITON_ATTN here
# and can't run the fused multi-step draft decode MTP wants.
attention-backend: TRITON_ATTN

# Images yes, video no: one video item reserves a six-figure token budget and several GiB
# this card does not have. 3.8 adds native video understanding, so that stays deliberate
# rather than incidental.
#
# The image count is per conversation rather than per message, and overrunning it 400s
# every later request instead of degrading. vLLM caps it at max-model-len over 16384 tokens
# per image, so 81920 allows 5. Change both together or not at all.
limit-mm-per-prompt: '{"image": 5, "video": 0}'

# Host RAM for processed images, multiplied by (api_server_count + data_parallel_size), so
# the 4 GiB default can claim 8 GiB of the box's ~30 GB.
mm-processor-cache-gb: 1

# With KV pinned this no longer sizes anything. It is the free-VRAM check vLLM makes at
# startup, and run.sh waits on the same figure before launching: 0.91 of the 31.41 GiB vLLM
# sees is 28.58 GiB, which leaves the desktop 2.83 GiB. The sway session plus browsers runs
# 1.8-2.9 GiB, so raising this makes launches wait or fail on desktop load.
gpu-memory-utilization: 0.91
max-num-seqs: 4
enable-chunked-prefill: true
enable-prefix-caching: true

# The chat template still emits <think> and <tool_call>/<function=/<parameter=, so the 3.6
# parsers carry over. Sampling is per-request, so it lives in the client.
reasoning-parser: qwen3
enable-auto-tool-choice: true
tool-call-parser: qwen3_xml

# The template takes a `reasoning_effort` kwarg defaulting to `xhigh`, so this thinks hard
# out of the box. It accepts xhigh, medium and low, and aliases `high` onto xhigh; anything
# else makes the template raise and the request 400s (vLLM #52738). That alias only exists
# in unsloth's template, which ships with the tokenizer here. Pointing `tokenizer:` at
# Qwen's own repo swaps in their stricter template, which rejects `high` outright and reads
# only the first system message instead of merging system and developer messages.
